<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <link href="CSS/style.css" type="text/css" rel="stylesheet">
        <!-- Swiper CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>

        <!-- Swiper JS -->
        <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
        
        <!-- Utils first -->
        <script src="utils.js"></script>

        <!--  DATA FIRST -->
        <script src="events-data.js"></script>

        <!--  THEN UI -->
        <script src="events-ui.js"></script>


    </head>

    <body>
        <!--
            Everything visible on the webpage goes inside here.
            This includes text, images, buttons, and anything else people can see and click.
            Think of this as the "body" of the page — what the visitor actually sees on screen.
        -->

        <!-- 
            LANGUAGE TOGGLE GUIDE:
            - The button at the end of the navbar switches between English and Chinese.
            - Each text item has a data-en="English text" and data-zh="Chinese text".
            - To change a label, just update those attributes. Example:
                <a data-en="Home" data-zh="首页">Home</a>
        -->


        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg myNav">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <!-- Logo on the LEFT -->
                <a class="navbar-brand d-flex align-items-center customlink" href="index.html">
                    <img src="Images/agpc-logo-new-a3-crop_orig.jpg" alt="Church Logo" class="navbar-logo">
                    <span class="navbar-text"data-en="Abundant Grace Presbyterian Church"
                      data-zh="嘉恩堂长老会">
                    Abundant Grace Presbyterian Church</span>
                </a>

                <!-- This wrapper contains all nav links and toggle button on the RIGHT -->
                <div class="d-flex align-items-center">
                <!-- Navbar toggler (for small screens) -->
                <button class="navbar-toggler me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Collapsible nav links -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                    <!-- Your nav items here -->
                    <li class="nav-item">
                        <a class="nav-link" href="Visit Us.html" data-en="Visit Us" data-zh="来访我们">Visit Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Sermons.html" data-en="Sermons" data-zh="讲道">Sermons</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Events.html" data-en="Events" data-zh="活动">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Give.html" data-en="Give" data-zh="奉献">Give</a>
                    </li>

                    <!-- Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false" data-en="About Us" data-zh="关于我们">About Us</a>
                        <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="AGPC.html" data-en="AGPC" data-zh="嘉恩堂">AGPC</a></li>
                        <li><a class="dropdown-item" href="Ministries.html" data-en="Ministries" data-zh="事工">Ministries</a></li>
                        <li><a class="dropdown-item" href="Connect.html" data-en="Connect" data-zh="联系我们">Connect</a></li>
                        </ul>
                    </li>

                    <!-- Language toggle -->
                    <li class="nav-item">
                        <button id="languageToggle" class="btn btn-sm lang-toggle ms-3">中文</button>
                    </li>
                    </ul>
                </div>
                </div>
            </div>
        </nav>

        <!-- HERO / PAGE TITLE -->
        <section class="hero-section hero-events" style="background-color:#f3f4f6; padding:6rem 1.5rem;">
        <div class="container text-center">
            <h1 data-en="Events" data-zh="活动">Events</h1>
            <p data-en="See all upcoming church events and programs"
            data-zh="查看所有即将举行的教会活动和计划">
            See all upcoming church events and programs
            </p>
        </div>
        </section>

       <!-- UPCOMING EVENTS -->
        <section class="content-section swiper-section py-5">
        <div class="container">

            <h2 class="text-center mb-5"
                data-en="Upcoming Events"
                data-zh="即将举行的活动">
            Upcoming Events
            </h2>

            <!-- SWIPER CONTAINER -->
            <div class="swiper upcoming-events-swiper">

            <!-- REQUIRED WRAPPER -->
            <div class="swiper-wrapper" id="upcoming-events">
                <!-- JS injects swiper-slide here -->
            </div>

            <!-- NAVIGATION -->
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>

            <!-- PAGINATION -->
            <div class="swiper-pagination"></div>

            </div>

        </div>
        </section>

        <!-- PAST EVENTS -->
        <section class="light-section py-5">
        <div class="container text-center">

            <h2 data-en="Event Archive" data-zh="活动档案">
            Event Archive
            </h2>

            <p data-en="Browse all past events" data-zh="浏览所有往期活动">
            Browse all past events
            </p>

            <div class="swiper past-events-swiper mt-4">

            <div class="swiper-wrapper" id="past-events">
                <!-- JS injects slides -->
            </div>

            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>

            </div>

        </div>
        </section>


        <!-- EVENT GALLERY MODAL -->
        <div class="modal fade" id="galleryModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-dark text-white">

            <div class="modal-header border-0">
                <h5 class="modal-title">Event Gallery</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body text-center">

                <!-- BIG IMAGE -->
                <img id="mainGalleryImage"
                    src=""
                    class="img-fluid rounded mb-3"
                    style="max-height: 70vh; object-fit: contain;">

                <!-- THUMBNAILS -->
                <div id="thumbnailStrip"
                    class="d-flex gap-2 justify-content-center flex-wrap">
                </div>

            </div>

            </div>
        </div>
        </div>

        <!-- FOOTER -->
        <footer class="footer mt-5">
        <div class="container text-center">
            <p>© Abundant Grace Presbyterian Church</p>
        </div>
        </footer>


    </body>



</html>
